#jenkins컨테이너 실행 방식
services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "7070:8080"
      - "50000:50000"
    user: root
    volumes:
      - ./volumes/jenkins:/var/jenkins_home
      - ./kubeconfig:/root/.kube
      - /var/run/docker.sock:/var/run/docker.sock
      - C:\backend5\backendProject:/var/jenkins_home/workspace/backend5/backendProject
    restart: unless-stopped
    networks:
      - prod_server

networks:
  prod_server:
    external: true