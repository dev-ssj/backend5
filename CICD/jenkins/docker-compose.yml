services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "7070:8080"
      - "50000:50000"
    user: root
    volumes:
      - ./volumes/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - C:\backend5:/var/jenkins_home/workspace/backend5_Test_local  # 프로젝트 주소 매칭
    restart: unless-stopped
